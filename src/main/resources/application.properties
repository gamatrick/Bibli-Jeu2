spring.application.name=Bibli-Jeu2
spring.config.import=optional:file:.env[.properties]

# Adresse de l'API RAWG
rawg.api.url=https://api.rawg.io/api
rawg.api.cle=${RAWG_API_KEY:}

# Base H2 enregistrée = ./data/bibliotheque.mv.db
spring.datasource.url=jdbc:h2:file:./data/bibliotheque
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.servlet.session.tracking-modes=cookie

# Actuator : on n'expose que l'état de santé, rien d'autre
management.endpoints.web.exposure.include=health
# Ajoute /actuator/health/liveness et /actuator/health/readiness pour Kubernetes
management.endpoint.health.probes.enabled=true